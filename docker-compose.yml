services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daytrack
      POSTGRES_PASSWORD: daytrack
      POSTGRES_DB: daytrack
    ports:
      - "5432:5432"
    volumes:
      - daytrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daytrack"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  daytrack-postgres:
